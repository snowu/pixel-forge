  html,body{margin:0;height:100%;background:#07040d;color:#e6dcf7;font:13px 'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

<header><b>spritewright</b><span id="account"></span><span class="tag">pixel art editor · PNGs, folders and GitHub repos · edit, download or propose a pull request</span><a href="https://github.com/snowu/spritewright" target="_blank" rel="noopener" style="margin-left:auto;font-size:12px">source</a></header>
<div id="app"></div>
<script src="spritewright.js"></script>
<script>
  // Standalone use (this page hosted anywhere, e.g. GitHub Pages): it asks which GitHub repository or folder to open.
  // Query options:  ?repo=owner/name[&branch=main]       open that GitHub repository straight away
  //                 ?manifest=pixel-art.json&base=../      a generated manifest (see `spritewright scan`); add &repo=owner/name for pull requests
  //                 &accent=%23b98cff                      theme colour
  //                 &bg=1a1426                             the game's background colour (offered as "Project background")
  const q = new URLSearchParams(location.search);
  const opts = {};
  if (q.get('manifest')) opts.manifestUrl = q.get('manifest');
  if (q.get('base') != null) opts.baseUrl = q.get('base');
  if (q.get('repo')) { opts.github = { slug: q.get('repo') }; if (q.get('branch')) opts.github.base = q.get('branch'); if (q.get('prefix')) opts.github.prefix = q.get('prefix'); if (!q.get('manifest')) opts.connect = 'github'; }
  if (q.get('accent')) opts.accent = q.get('accent');
  if (/^#?[0-9a-f]{6}$/i.test(q.get('bg') || '')) opts.background = '#' + q.get('bg').replace('#', ''); // ?bg=1a1426: the game's background, offered as "Project background"
  // Sign in with GitHub needs the small auth service in worker/. Point at yours with ?auth=https://your-worker.example or set the default below.
  const DEFAULT_AUTH_BASE = 'https://spritewright-auth.zancato-t.workers.dev';
  const authQ = q.get('auth'), auth = authQ === 'off' ? '' : authQ || DEFAULT_AUTH_BASE; if (auth) opts.authBase = auth; // ?auth=off: token-only mode
  opts.accountEl = '#account'; // "Signed in as … / Sign out" next to the title
  opts.githubApp = q.get('app') || 'spritewright'; // the GitHub App people install on their repositories (link shown under the repo list)
  Spritewright.mount(document.getElementById('app'), opts);
</script>

  const durations = [3200,180,180,180,180,180,180];
  const icon = document.querySelector('link[rel="icon"]');
  const preview = document.getElementById('favicon-preview');
  const motion = matchMedia('(prefers-reduced-motion: reduce)');
  let timer, frame = 0;
  function draw() {
    icon.href = frames[frame];
    if (preview) preview.src = frames[frame];
  }
  function reset() {
    clearTimeout(timer);
    frame = 0;
    draw();
    if (!document.hidden && !motion.matches) timer = setTimeout(tick, durations[0]);
  }
  function tick() {
    frame = (frame + 1) % frames.length;
    draw();
    timer = setTimeout(tick, durations[frame]);
  }
  document.addEventListener('visibilitychange', reset);
  motion.addEventListener('change', reset);
  reset();
})();
</script>
