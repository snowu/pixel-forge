  if (q.get('repo')) { opts.github = { slug: q.get('repo') }; if (q.get('branch')) opts.github.base = q.get('branch'); if (q.get('prefix')) opts.github.prefix = q.get('prefix'); if (!q.get('manifest')) opts.connect = 'github'; }

  if (/^#?[0-9a-f]{6}$/i.test(q.get('bg') || '')) opts.background = '#' + q.get('bg').replace('#', ''); // ?bg=1a1426: the game's background, offered as "Project background"
  // Sign in with GitHub needs the small auth service in worker/. Point at yours with ?auth=https://your-worker.example or set the default below.
  const DEFAULT_AUTH_BASE = 'https://spritewright-auth.zancato-t.workers.dev';
  const authQ = q.get('auth'), auth = authQ === 'off' ? '' : authQ || DEFAULT_AUTH_BASE; if (auth) opts.authBase = auth; // ?auth=off: token-only mode
  opts.accountEl = '#account'; // "Signed in as … / Sign out" next to the title
  opts.githubApp = q.get('app') || 'spritewright'; // the GitHub App people install on their repositories (link shown under the repo list)
  Spritewright.mount(document.getElementById('app'), opts);
</script>
