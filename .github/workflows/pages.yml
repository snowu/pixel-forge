# Publishes the standalone editor (index.html + spritewright.js) with GitHub Pages, so it can be used by itself with no install.
# One-time setup (done for this repository): Settings > Pages > Build and deployment > Source: GitHub Actions.
name: pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deployment.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - run: mkdir site && cp index.html spritewright.js site/
      # Installable app (Pages only, so the local server and the package stay request-free). Every app on snowu.github.io shares
      # one origin: without its own manifest (unique id, scope ./) Chrome matches another installed app and says "already installed".
      - run: cp -r pages/. site/ && sed -i 's#</head>#<link rel="manifest" href="manifest.webmanifest">\n<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">\n</head>#' site/index.html && grep -q 'rel="manifest"' site/index.html
      # Pages lets browsers cache files for 10 minutes; a versioned script URL makes every deploy load the new editor at once.
      - run: sed -i "s#<script src=\"spritewright.js\"></script>#<script src=\"spritewright.js?v=${GITHUB_SHA::12}\"></script>#" site/index.html && grep -q "spritewright.js?v=" site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deployment
        uses: actions/deploy-pages@v4
